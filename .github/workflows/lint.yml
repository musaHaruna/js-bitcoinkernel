name: Library Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  native-integration:
    name: Native integration (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x64
            runner: ubuntu-latest
          - label: Linux ARM64
            runner: ubuntu-24.04-arm
          - label: macOS universal
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify packaged native libraries
        run: npm run native:verify

      - name: Run native integration tests
        run: npm test

  quality-check:
    name: Quality and package build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify packaged native libraries
        run: npm run native:verify

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript Type Check
        run: npm run type-check

      - name: Build package
        run: npm run build

      - name: Build documentation
        run: npm run docs:build
