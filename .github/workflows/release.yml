name: Package release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-native:
    name: Build ${{ matrix.id }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-x64
            runner: ubuntu-latest
            target: x64
          - id: linux-arm64
            runner: ubuntu-24.04-arm
            target: arm64
          - id: darwin-universal
            runner: macos-15-intel
            target: universal
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build native library
        run: npm run native:build -- ${{ matrix.target }}

      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.id }}
          path: src/js-kernel/binaries/${{ matrix.id }}
          if-no-files-found: error

  package:
    name: Validate and package
    needs: build-native
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download native libraries
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: native-artifacts

      - name: Place native libraries in package targets
        run: |
          for target in darwin-universal linux-arm64 linux-x64; do
            rm -rf "src/js-kernel/binaries/${target}"
            mv "native-artifacts/native-${target}" "src/js-kernel/binaries/${target}"
          done

      - name: Verify native libraries
        run: npm run native:verify

      - name: Run release checks
        run: npm run type-check && npm run lint && npm test && npm run build && npm run docs:build

      - name: Pack npm artifact
        run: npm pack

      - name: Upload npm artifact
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: "*.tgz"
          if-no-files-found: error

  publish:
    name: Publish to npm
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Confirm release tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: test "${RELEASE_TAG#v}" = "$(node -p \"require('./package.json').version\")"

      - name: Download npm artifact
        uses: actions/download-artifact@v4
        with:
          name: npm-package

      - name: Publish with npm trusted publishing
        run: npm publish ./*.tgz --access public --provenance
